[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "letsvibe-engine"
version = "9.3.0"
description = "Versioned AI software evaluation engine for LetsVibe"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Todd0042" }
]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["letsvibe_engine*"]

[tool.setuptools.package-data]
letsvibe_engine = ["registry.json", "profiles/*.json"]
